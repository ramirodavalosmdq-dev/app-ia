<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5F7356">
<title>Corteza · Caja</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#6F8565; --sage-d:#566B4D; --sage-l:#E7ECE1; --cream:#F7F3EA; --paper:#FFFDF8;
  --wood:#A47A4F; --ink:#2E3829; --mut:#7C8576; --line:#E3DED2;
  --ok:#2F9E5B; --warn:#C9822B; --err:#C2493D;
  --r:16px; --shadow:0 6px 20px -10px rgba(46,56,41,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--ink);overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit;color:inherit}
.brand{font-family:"Josefin Sans",sans-serif;letter-spacing:4px;font-weight:400}
.app{display:grid;grid-template-rows:auto auto 1fr auto;height:100%}

/* top */
.trial{background:var(--ink);color:#E9EFE4;font-size:12.5px;text-align:center;padding:6px 10px;display:flex;gap:10px;justify-content:center;align-items:center}
.trial b{color:#C7DDB9}
.trial .pill{background:rgba(255,255,255,.12);border-radius:20px;padding:2px 9px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px}
.mono{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--sage);display:grid;place-items:center;color:var(--sage);font-family:"Josefin Sans";font-size:20px}
.logo .t{line-height:1}
.logo .t b{display:block;font-family:"Josefin Sans";letter-spacing:5px;font-weight:400;font-size:19px;color:var(--sage-d)}
.logo .t small{font-family:"Josefin Sans";letter-spacing:2px;font-size:10px;color:var(--mut)}
.top .sp{flex:1}
.seller{display:flex;align-items:center;gap:8px;background:var(--sage-l);border-radius:30px;padding:5px 12px 5px 5px;font-size:14px;font-weight:500}
.av{width:30px;height:30px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.clock{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px}

main{overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow:auto;display:none}
.view.on{display:block}

/* nav */
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:9px 4px 10px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--sage-d);font-weight:600}
nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--sage)}
nav .dot{position:absolute;top:6px;right:calc(50% - 20px);background:var(--err);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px}

/* caja */
.pos{display:grid;grid-template-columns:1fr 360px;height:100%}
.pos .left{overflow:auto;padding:14px 16px 90px}
.sec-t{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-weight:600;margin:4px 2px 8px;display:flex;align-items:center;gap:8px}
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.topb{background:var(--sage);color:#fff;border-radius:14px;padding:12px 10px;text-align:left;min-height:68px;box-shadow:var(--shadow);transition:transform .08s}
.topb:active,.pb:active{transform:scale(.96)}
.topb b{display:block;font-size:14.5px;font-weight:600;line-height:1.15}
.topb small{opacity:.85;font-size:12.5px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.search{flex:1;min-width:160px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;outline:none}
.search:focus{border-color:var(--sage)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--paper);border-radius:30px;padding:8px 14px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.pb{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s,border-color .2s}
.pb b{font-size:15px;font-weight:600;line-height:1.2}
.pb .pr{font-size:14px;color:var(--sage-d);font-weight:600;margin-top:6px}
.pb .u{font-size:11.5px;color:var(--mut);font-weight:500}
.pb.out{opacity:.4;pointer-events:none}
.pb.flash{border-color:var(--sage);background:var(--sage-l)}
.sortsel{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;font-size:14px}

.ticket{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ticket .th{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.ticket .th h3{font-size:16px}
.lines{flex:1;overflow:auto;padding:0 10px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 6px;border-bottom:1px dashed var(--line);align-items:center}
.line .n{font-size:14.5px;font-weight:600}
.line .d{font-size:12.5px;color:var(--mut)}
.line .s{font-weight:600;font-size:15px;text-align:right}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:9px;background:var(--sage-l);font-size:17px;font-weight:600;color:var(--sage-d)}
.empty{color:var(--mut);text-align:center;padding:40px 16px;font-size:14px;line-height:1.5}
.tfoot{padding:12px 14px 14px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tot span{color:var(--mut);font-size:14px}
.tot b{font-size:30px;letter-spacing:-.5px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay button{border-radius:13px;padding:14px 4px;font-weight:600;font-size:13.5px;background:var(--sage-l);color:var(--sage-d);border:1.5px solid transparent}
.pay button.cash{background:var(--sage);color:#fff;grid-column:1/-1;font-size:17px;padding:16px}
.pay button:disabled{opacity:.4}
.lnk{color:var(--mut);font-size:13px;text-decoration:underline;margin-top:10px;display:block;text-align:center;width:100%}
.mobbar{display:none}.grab{display:none}

/* modal */
.ov{position:fixed;inset:0;background:rgba(30,36,27,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.ov.on{display:flex}
@media (min-width:700px){.ov{align-items:center}}
.md{background:var(--paper);border-radius:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:20px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.md h3{font-size:19px;margin-bottom:4px}
.md p.s{color:var(--mut);font-size:14px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kb{background:var(--sage-l);color:var(--sage-d);border-radius:13px;padding:15px 6px;font-weight:600;font-size:16px}
.kb.sel{background:var(--sage);color:#fff}
.in{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:17px;outline:none}
.in:focus{border-color:var(--sage)}
.lbl{font-size:13px;color:var(--mut);margin:12px 0 6px;display:block}
.btn{width:100%;border-radius:14px;padding:15px;font-weight:600;font-size:16px;background:var(--sage);color:#fff;margin-top:14px}
.btn.green{background:var(--ok)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink);margin-top:8px}
.btn:disabled{opacity:.45}
.err{color:var(--err);font-size:13.5px;min-height:18px;margin-top:8px;font-weight:500}
.big{font-size:34px;font-weight:700;text-align:center;letter-spacing:-.5px}
.vuelto{background:var(--sage-l);border-radius:14px;padding:12px;text-align:center;margin-top:12px}
.vuelto b{font-size:26px;color:var(--sage-d)}
.pin{display:flex;justify-content:center;gap:12px;margin:14px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--sage)}
.pin i.f{background:var(--sage)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}
.pad button{background:var(--sage-l);border-radius:14px;padding:16px;font-size:22px;font-weight:600;color:var(--sage-d)}

/* panel */
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.h1{font-size:22px;font-weight:700;margin-bottom:2px}
.sub{color:var(--mut);font-size:14px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi span{font-size:12.5px;color:var(--mut);display:block}
.kpi b{font-size:24px;letter-spacing:-.5px;display:block;margin-top:4px}
.kpi small{font-size:12.5px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--err)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h4{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.feed{display:grid;gap:2px;max-height:340px;overflow:auto}
.fi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.fi.new{animation:hl 2s ease}
@keyframes hl{from{background:#E4F2DA}}
.fi .m{font-size:12px;color:var(--mut)}
.hours{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:10px}
.hours div{flex:1;background:var(--sage-l);border-radius:5px 5px 0 0;position:relative;min-height:2px}
.hours div.pk{background:var(--sage)}
.hours div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut)}
.rank{display:grid;gap:8px}
.rk{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:14px}
.rk .b{grid-column:1/-1;height:7px;border-radius:5px;background:var(--sage-l);overflow:hidden}
.rk .b i{display:block;height:100%;background:var(--sage);border-radius:5px}
.mp{display:grid;gap:8px}
.mp div{display:flex;justify-content:space-between;font-size:14px;padding:8px 10px;background:var(--cream);border-radius:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tools button{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;background:var(--paper)}
.tools button.on{background:var(--ok);color:#fff;border-color:var(--ok)}

/* equipo */
.kiosk{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:420px;margin:0 auto 18px;text-align:center}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.secc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.secc h5{font-size:14px;display:flex;justify-content:space-between;margin-bottom:10px}
.secc h5 span{background:var(--sage-l);color:var(--sage-d);border-radius:20px;padding:1px 9px;font-size:12.5px}
.emp{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.emp .av{width:42px;height:42px;font-size:15px}
.emp b{font-size:14.5px;display:block}
.emp small{color:var(--mut);font-size:12.5px}
.none{color:var(--mut);font-size:13px;padding:6px 0}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h th{text-align:left;color:var(--mut);font-weight:500;font-size:12.5px;padding:8px 6px;border-bottom:1px solid var(--line)}
table.h td{padding:9px 6px;border-bottom:1px solid var(--line)}
table.h tr:nth-child(even) td{background:#F3F1EA}
video{width:100%;border-radius:14px;background:#000;margin-top:10px;max-height:220px;object-fit:cover}

/* productos */
.prow{display:grid;grid-template-columns:1fr 120px auto auto;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.prow:nth-child(even){background:#F8F6F0}
.prow b{font-size:14.5px}
.prow small{display:block;color:var(--mut);font-size:12px}
.prow input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;text-align:right;background:#fff}
.tg{width:46px;height:28px;border-radius:20px;background:var(--line);position:relative;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--ok)}
.tg.on::after{left:21px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{font-size:12px;padding:2px 6px;background:var(--sage-l);border-radius:6px}
.plist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chg{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.chg s{color:var(--mut)}
.chg input{width:100px;border:1.5px solid var(--line);border-radius:10px;padding:8px;text-align:right;font-size:15px}
.pct{font-size:12px;font-weight:600}

/* mejoras */
.req{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.req p{flex:1;font-size:14.5px;line-height:1.4}
.req small{color:var(--mut);font-size:12px;display:block;margin-top:3px}
.note{background:#F0F5EA;border:1px solid #D7E3CC;border-radius:14px;padding:14px;font-size:14px;line-height:1.5;margin-bottom:14px}
.wa{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:14px;padding:15px;background:#25D366;color:#073b1c;font-weight:700;text-decoration:none;margin-top:12px}

.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:500;opacity:0;transition:.3s;z-index:90;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lock{position:fixed;inset:0;background:var(--cream);z-index:99;display:none;place-items:center;text-align:center;padding:24px}
.lock.on{display:grid}

@media (max-width:820px){
  .pos{grid-template-columns:1fr}
  .ticket{position:fixed;left:0;right:0;bottom:0;top:30%;z-index:40;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translateY(110%);transition:transform .3s;border-left:none}
  .ticket.open{transform:none}
  .grab{display:block;width:100%;padding:10px;color:var(--mut);font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
  .mobbar{display:flex;position:absolute;left:12px;right:12px;bottom:12px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;align-items:center;justify-content:space-between;font-weight:600;box-shadow:var(--shadow);z-index:30}
  .mobbar b{font-size:20px}
  .top .clock{display:none}
  .prow{grid-template-columns:1fr 96px auto}
  .prow .mv{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="trial" id="trial"></div>
  <div class="top">
    <div class="logo"><div class="mono">C</div><div class="t"><b>CORTEZA</b><small>PASTELERÍA ARTESANAL</small></div></div>
    <div class="sp"></div>
    <div class="clock" id="clock"></div>
    <button class="seller" id="sellerBtn"></button>
  </div>
  <main>
    <section class="view" id="v-caja"></section>
    <section class="view" id="v-panel"></section>
    <section class="view" id="v-equipo"></section>
    <section class="view" id="v-prod"></section>
    <section class="view" id="v-mejoras"></section>
  </main>
  <nav id="nav">
    <button data-v="caja"><span class="i">🧾</span>Caja</button>
    <button data-v="panel"><span class="i">📊</span>Panel</button>
    <button data-v="equipo"><span class="i">👥</span>Equipo</button>
    <button data-v="prod"><span class="i">🥐</span>Productos</button>
    <button data-v="mejoras"><span class="i">✨</span>Mejoras</button>
  </nav>
</div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>
<div class="lock" id="lock"></div>

<script>
/* ================= CONFIG ================= */
const CFG = {
  negocio:"Corteza", trialDias:7, waAppIA:"5492233467936", corteHora:20,
  sectores:["Mostrador","Producción","Pastelería","Limpieza"],
  pagos:[["efectivo","💵 Efectivo"],["mp","📱 Mercado Pago"],["debito","💳 Débito"],["transf","🏦 Transferencia"]]
};
const SEED_CATS=["Panadería","Facturas","Tortas y tartas"];
const SEED_PRODS=[
 ["Pan","Panadería","kg",3600],["Pan de grasa","Panadería","kg",6000],["Chipá","Panadería","kg",24000],
 ["Prepizza x2","Panadería","u",4500],["Burger brioche x2","Panadería","u",1200],["Pan de papa x2","Panadería","u",1200],["Sacramentos","Panadería","u",2800],
 ["Factura","Facturas","u",900],["Docena de facturas","Facturas","u",10000],["Masas","Facturas","kg",24000],
 ["Tarta de ricota","Tortas y tartas","u",18000],["Brownie","Tortas y tartas","u",20000],["Lemon pie","Tortas y tartas","u",20000],["Tarta de coco y DDL","Tortas y tartas","u",20000],
 ["Tarta de frutilla","Tortas y tartas","u",25000],["Cheesecake frutos rojos","Tortas y tartas","u",25000],["Cheesecake maracuyá","Tortas y tartas","u",25000],
 ["Chajá","Tortas y tartas","u",25000],["Torta mousse","Tortas y tartas","u",25000],["Torta","Tortas y tartas","u",25000],["Torta a pedido","Tortas y tartas","kg",23000]
];
const SEED_EMPS=[{id:"e0",n:"Dueño",pin:"0000",owner:true},{id:"e1",n:"Lucía",pin:"1111"},{id:"e2",n:"Martín",pin:"2222"},{id:"e3",n:"Sofía",pin:"3333"},{id:"e4",n:"Carla",pin:"4444"}];

/* ================= ESTADO ================= */
const KEY="appia-corteza-v1";
let S;
function fresh(){return{
  prods:SEED_PRODS.map((p,i)=>({id:"p"+i,n:p[0],cat:p[1],unit:p[2],price:p[3],out:false,ord:i})),
  cats:[...SEED_CATS], emps:SEED_EMPS.map(e=>({...e})), sales:[], shifts:[], reqs:[], log:[],
  trialStart:Date.now(), seller:"e1", sort:"top"}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.prods) S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("⚠️ No se pudo guardar")}};
let cart=[], curView="caja", curCat="Todas", ownerOK=0, sim=null;

/* ================= UTILES ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $$f=n=>"$"+Math.round(n).toLocaleString("es-AR");
const hhmm=t=>new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()};
const today=()=>dayKey(Date.now());
const emp=id=>S.emps.find(e=>e.id===id)||{n:"—"};
const ini=n=>n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
const avatar=(e,photo)=>`<span class="av">${photo?`<img src="${photo}" alt="">`:esc(ini(e.n))}</span>`;
const prod=id=>S.prods.find(p=>p.id===id);
const uid=()=>Math.random().toString(36).slice(2,9);
const qtyTxt=(q,u)=>u==="kg"?(q>=1?(+q.toFixed(3))+" kg":Math.round(q*1000)+" g"):q+" u.";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2000)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.25);o.start();o.stop(a.currentTime+.25)}catch(e){}}
function modal(html){$("#md").innerHTML=html;$("#ov").classList.add("on")}
function closeM(){$("#ov").classList.remove("on");stopCam()}
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeM()});
function soldCount(pid,days=30){const lim=Date.now()-days*864e5;let n=0;for(const s of S.sales)if(s.ts>lim)for(const it of s.items)if(it.pid===pid)n+=it.unit==="kg"?it.qty*4:it.qty;return n}

/* ================= CAJA ================= */
function sortedProds(list){
  const s=S.sort;
  if(s==="az")return [...list].sort((a,b)=>a.n.localeCompare(b.n));
  if(s==="pu")return [...list].sort((a,b)=>a.price-b.price);
  if(s==="pd")return [...list].sort((a,b)=>b.price-a.price);
  if(s==="man")return [...list].sort((a,b)=>a.ord-b.ord);
  return [...list].sort((a,b)=>soldCount(b.id)-soldCount(a.id)||a.ord-b.ord);
}
function rCaja(){
  const tops=sortedProds(S.prods.filter(p=>!p.out)).slice(0,6);
  const q=($("#q")?.value||"").toLowerCase();
  let list=S.prods.filter(p=>(curCat==="Todas"||p.cat===curCat)&&(!q||p.n.toLowerCase().includes(q)));
  list=sortedProds(list);
  $("#v-caja").innerHTML=`<div class="pos"><div class="left">
    <div class="sec-t">⚡ Más vendidos</div>
    <div class="tops">${tops.map(p=>`<button class="topb" data-add="${p.id}"><b>${esc(p.n)}</b><small>${$$f(p.price)}${p.unit==="kg"?" /kg":""}</small></button>`).join("")}</div>
    <div class="bar"><input class="search" id="q" placeholder="🔍 Buscar producto…" value="${esc(q)}" autocomplete="off">
      <select class="sortsel" id="sort">${[["top","Más vendidos"],["az","A–Z"],["pu","Precio ↑"],["pd","Precio ↓"],["man","Mi orden"]].map(([k,t])=>`<option value="${k}"${S.sort===k?" selected":""}>${t}</option>`).join("")}</select></div>
    <div class="chips">${["Todas",...S.cats].map(c=>`<button class="chip${c===curCat?" on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="grid">${list.map(p=>`<button class="pb${p.out?" out":""}" data-add="${p.id}"><b>${esc(p.n)}</b><div><div class="pr">${$$f(p.price)}</div><div class="u">${p.out?"Sin stock":p.unit==="kg"?"por kilo · elegí cantidad":"por unidad"}</div></div></button>`).join("")||`<div class="empty">No hay productos con "${esc(q)}"</div>`}</div>
    <button class="lnk" id="byAmount">¿Mucha gente esperando? Cobrar solo por monto</button>
  </div>
  <aside class="ticket" id="ticket"></aside>
  <button class="mobbar" id="mobbar"></button></div>`;
  const v=$("#v-caja");
  v.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addProd(b.dataset.add,b));
  v.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{curCat=b.dataset.cat;rCaja()});
  $("#q").oninput=()=>{const pos=$("#q").selectionStart;rCaja();$("#q").focus();$("#q").setSelectionRange(pos,pos)};
  $("#sort").onchange=e=>{S.sort=e.target.value;save();rCaja()};
  $("#byAmount").onclick=amountModal;
  $("#mobbar").onclick=()=>$("#ticket").classList.add("open");
  rTicket();
}
function addProd(id,btn){
  const p=prod(id); if(!p||p.out)return;
  if(p.unit==="kg")return kgModal(p);
  const l=cart.find(x=>x.pid===id); if(l)l.qty++; else cart.push({pid:id,n:p.n,unit:"u",price:p.price,qty:1});
  if(btn){btn.classList.add("flash");setTimeout(()=>btn.classList.remove("flash"),180)}
  rTicket();
}
function kgModal(p){
  let qty=0;
  modal(`<h3>${esc(p.n)}</h3><p class="s">${$$f(p.price)} el kilo · elegí la cantidad</p>
   <div class="g4">${[[.25,"¼ kg"],[.5,"½ kg"],[.75,"¾ kg"],[1,"1 kg"]].map(([q,t])=>`<button class="kb" data-q="${q}">${t}</button>`).join("")}</div>
   <div class="g2" style="margin-top:4px"><div><label class="lbl">Gramos (balanza)</label><input class="in" id="kgG" type="number" inputmode="numeric" placeholder="Ej: 380"></div>
   <div><label class="lbl">o monto $</label><input class="in" id="kgM" type="number" inputmode="numeric" placeholder="Ej: 2000"></div></div>
   <div class="big" id="kgT" style="margin-top:14px">—</div><div class="err" id="kgE" style="text-align:center"></div>
   <button class="btn" id="kgOk">Agregar</button>`);
  const upd=()=>{$("#kgT").textContent=qty>0?`${qtyTxt(qty,"kg")} · ${$$f(qty*p.price)}`:"—";$("#kgE").textContent=""};
  $("#md").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{qty=+b.dataset.q;$("#md").querySelectorAll("[data-q]").forEach(x=>x.classList.toggle("sel",x===b));$("#kgG").value="";$("#kgM").value="";upd()});
  $("#kgG").oninput=e=>{qty=(+e.target.value||0)/1000;$("#kgM").value="";upd()};
  $("#kgM").oninput=e=>{qty=(+e.target.value||0)/p.price;$("#kgG").value="";upd()};
  $("#kgOk").onclick=()=>{if(!(qty>0)){$("#kgE").textContent="Elegí una cantidad";return} if(qty>20){$("#kgE").textContent="Revisá la cantidad: más de 20 kg";return}
    cart.push({pid:p.id,n:p.n,unit:"kg",price:p.price,qty:+qty.toFixed(3)});closeM();rTicket()};
}
function total(){return Math.round(cart.reduce((s,l)=>s+l.qty*l.price,0))}
function rTicket(){
  const t=total(), n=cart.length;
  $("#ticket").innerHTML=`<button class="grab" id="grab" aria-label="Cerrar">Seguir cargando ▾</button><div class="th"><h3>Venta actual</h3>${n?`<button class="lnk" style="margin:0;width:auto" id="clr">Vaciar</button>`:""}</div>
   <div class="lines">${n?cart.map((l,i)=>`<div class="line"><div><div class="n">${esc(l.n)}</div><div class="d">${l.unit==="kg"?qtyTxt(l.qty,"kg")+" × "+$$f(l.price)+"/kg":$$f(l.price)+" c/u"}</div></div>
     <div class="s">${$$f(l.qty*l.price)}</div>
     <div class="qty">${l.unit==="u"?`<button data-m="${i}">−</button><b>${l.qty}</b><button data-p="${i}">+</button>`:`<button data-m="${i}">✕</button>`}</div></div>`).join("")
     :`<div class="empty">Tocá los productos para cargarlos.<br>Podés hacerlo mientras armás el pedido.</div>`}</div>
   <div class="tfoot"><div class="tot"><span>Total</span><b>${$$f(t)}</b></div>
   <div class="pay">${CFG.pagos.map(([k,l])=>`<button class="${k==="efectivo"?"cash":""}" data-pay="${k}" ${n?"":"disabled"}>${l}</button>`).join("")}</div></div>`;
  const tk=$("#ticket");
  tk.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{cart[+b.dataset.p].qty++;rTicket()});
  tk.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const l=cart[+b.dataset.m];if(l.unit==="u"&&l.qty>1)l.qty--;else cart.splice(+b.dataset.m,1);rTicket()});
  tk.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>pay(b.dataset.pay));
  const c=$("#clr"); if(c)c.onclick=()=>{cart=[];rTicket()};
  $("#grab").onclick=()=>$("#ticket").classList.remove("open");
  const mb=$("#mobbar"); if(mb){mb.style.display=n?"":"none";mb.innerHTML=`<span>🧾 ${n} ítem${n>1?"s":""} · Cobrar</span><b>${$$f(t)}</b>`}
}
function pay(m,amountOnly){
  const t=amountOnly?amountOnly:total();
  if(m!=="efectivo")return finish(m,t,amountOnly);
  modal(`<h3>Cobro en efectivo</h3><p class="s">Total a cobrar</p><div class="big">${$$f(t)}</div>
   <label class="lbl">¿Con cuánto paga?</label>
   <div class="g4">${["Justo",5000,10000,20000].map(v=>`<button class="kb" data-r="${v}">${v==="Justo"?v:$$f(v)}</button>`).join("")}</div>
   <input class="in" id="rec" type="number" inputmode="numeric" placeholder="Otro monto" style="margin-top:8px">
   <div class="vuelto" id="vu">Vuelto <b>$0</b></div><div class="err" id="cE"></div>
   <button class="btn green" id="cOk">✓ Confirmar venta</button>`);
  let rec=t;
  const upd=()=>{$("#vu").innerHTML=rec>=t?`Vuelto <b>${$$f(rec-t)}</b>`:`Falta <b style="color:var(--err)">${$$f(t-rec)}</b>`;$("#cE").textContent=""};
  $("#md").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{rec=b.dataset.r==="Justo"?t:+b.dataset.r;$("#rec").value="";$("#md").querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("sel",x===b));upd()});
  $("#rec").oninput=e=>{rec=+e.target.value||0;upd()};
  $("#cOk").onclick=()=>{if(rec<t){$("#cE").textContent="El monto recibido es menor al total";return}closeM();finish("efectivo",t,amountOnly)};
}
function finish(m,t,amountOnly){
  const sale={id:uid(),ts:Date.now(),emp:S.seller,method:m,total:t,items:amountOnly?[{pid:null,n:"Venta por monto",unit:"u",price:t,qty:1}]:cart.map(l=>({...l}))};
  S.sales.push(sale);save();cart=[];beep();toast(`✓ Venta registrada · ${$$f(t)}`);
  $("#ticket")?.classList.remove("open");if(curView==="caja")rCaja();
}
function amountModal(){
  modal(`<h3>Cobrar por monto</h3><p class="s">Para cuando hay fila. Se registra el total sin detalle de productos.</p>
   <input class="in" id="am" type="number" inputmode="numeric" placeholder="$ Total"><div class="err" id="amE"></div>
   <div class="g2" style="margin-top:6px">${CFG.pagos.map(([k,l])=>`<button class="kb" data-am="${k}">${l}</button>`).join("")}</div>`);
  setTimeout(()=>$("#am").focus(),100);
  $("#md").querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>{const v=Math.round(+$("#am").value);if(!(v>0)){$("#amE").textContent="Ingresá un monto mayor a 0";return}closeM();pay(b.dataset.am,v)});
}

/* ================= PANEL ================= */
function salesOf(key){return S.sales.filter(s=>dayKey(s.ts)===key)}
function rPanel(){
  const td=salesOf(today()), yd=salesOf(dayKey(Date.now()-864e5));
  const now=new Date(), cut=now.getHours()*60+now.getMinutes();
  const ydSame=yd.filter(s=>{const d=new Date(s.ts);return d.getHours()*60+d.getMinutes()<=cut});
  const sum=a=>a.reduce((x,s)=>x+s.total,0);
  const tT=sum(td), tY=sum(ydSame), diff=tY?Math.round((tT-tY)/tY*100):null;
  const cash=sum(td.filter(s=>s.method==="efectivo"));
  const byM={};td.forEach(s=>byM[s.method]=(byM[s.method]||0)+s.total);
  const byP={};td.forEach(s=>s.items.forEach(it=>{if(!it.pid)return;byP[it.n]=(byP[it.n]||0)+it.qty*it.price}));
  const topP=Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,6), maxP=topP[0]?.[1]||1;
  const byE={};td.forEach(s=>byE[s.emp]=(byE[s.emp]||0)+s.total);
  const hrs=[];for(let h=7;h<=21;h++)hrs.push(sum(td.filter(s=>new Date(s.ts).getHours()===h)));
  const maxH=Math.max(...hrs,1), pk=hrs.indexOf(Math.max(...hrs));
  const onShift=S.shifts.filter(x=>!x.out&&dayKey(x.in)===today());
  $("#v-panel").innerHTML=`<div class="wrap">
   <div class="h1">Hola 👋 así va ${esc(CFG.negocio)} hoy</div><div class="sub">${now.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})} · se actualiza en vivo</div>
   <div class="kpis">
    <div class="kpi"><span>Vendido hoy</span><b>${$$f(tT)}</b>${diff!==null?`<small class="${diff>=0?"up":"down"}">${diff>=0?"▲":"▼"} ${Math.abs(diff)}% vs. ayer a esta hora</small>`:`<small style="color:var(--mut)">Sin datos de ayer</small>`}</div>
    <div class="kpi"><span>Ventas</span><b>${td.length}</b><small style="color:var(--mut)">Ticket promedio ${$$f(td.length?tT/td.length:0)}</small></div>
    <div class="kpi"><span>Efectivo en caja</span><b>${$$f(cash)}</b><small style="color:var(--mut)">Lo que debería haber</small></div>
    <div class="kpi"><span>Trabajando ahora</span><b>${onShift.length}</b><small style="color:var(--mut)">${onShift.map(x=>emp(x.emp).n).join(", ")||"Nadie fichó"}</small></div>
   </div>
   <div class="cards">
    <div class="card"><h4>Ventas en vivo <span class="live">EN VIVO</span></h4><div class="feed" id="feed">${td.slice(-25).reverse().map(s=>feedItem(s)).join("")||`<div class="none">Todavía no hay ventas hoy.</div>`}</div></div>
    <div class="card"><h4>Ventas por hora ${hrs[pk]?`<small style="color:var(--mut);font-weight:500">Pico: ${pk+7} h</small>`:""}</h4>
      <div class="hours" style="margin-bottom:20px">${hrs.map((v,i)=>`<div class="${i===pk&&v?"pk":""}" style="height:${v/maxH*100}%" title="${$$f(v)}"><span>${i+7}</span></div>`).join("")}</div></div>
    <div class="card"><h4>Lo más vendido hoy</h4><div class="rank">${topP.map(([n,v])=>`<div class="rk"><span>${esc(n)}</span><b>${$$f(v)}</b><div class="b"><i style="width:${v/maxP*100}%"></i></div></div>`).join("")||`<div class="none">Sin ventas todavía.</div>`}</div></div>
    <div class="card"><h4>Medios de pago</h4><div class="mp">${CFG.pagos.map(([k,l])=>`<div><span>${l}</span><b>${$$f(byM[k]||0)}</b></div>`).join("")}</div>
      <h4 style="margin-top:16px">Por empleado</h4><div class="mp">${Object.entries(byE).sort((a,b)=>b[1]-a[1]).map(([e,v])=>`<div><span>${esc(emp(e).n)}</span><b>${$$f(v)}</b></div>`).join("")||`<div class="none">—</div>`}</div></div>
   </div>
   <div class="tools">
    <button id="simB" class="${sim?"on":""}">${sim?"⏸ Parar simulación":"▶ Simular ventas en vivo"}</button>
    <button id="demoB">📅 Cargar una semana de ejemplo</button>
    <button id="resetB">↺ Reiniciar demo</button>
   </div></div>`;
  $("#simB").onclick=()=>{if(sim){clearInterval(sim);sim=null}else{sim=setInterval(simSale,4000);simSale()}rPanel()};
  $("#demoB").onclick=()=>{demoWeek();rPanel();toast("Semana de ejemplo cargada")};
  $("#resetB").onclick=()=>modal(`<h3>¿Reiniciar la demo?</h3><p class="s">Se borran ventas, fichajes y cambios. No se puede deshacer.</p><button class="btn" style="background:var(--err)" id="rOk">Sí, reiniciar</button><button class="btn ghost" id="rNo">Cancelar</button>`)||($("#rNo").onclick=closeM,$("#rOk").onclick=()=>{S=fresh();save();closeM();cart=[];renderSeller();trial();rPanel();toast("Demo reiniciada")});
}
function feedItem(s,isNew){const e=emp(s.emp);const it=s.items.map(i=>i.unit==="kg"?`${qtyTxt(i.qty,"kg")} ${i.n}`:`${i.qty>1?i.qty+"× ":""}${i.n}`).join(", ");
  return `<div class="fi${isNew?" new":""}">${avatar(e)}<div><div>${esc(it)}</div><div class="m">${hhmm(s.ts)} · ${esc(e.n)} · ${CFG.pagos.find(p=>p[0]===s.method)?.[1]||""}</div></div><b>${$$f(s.total)}</b></div>`}
function randSale(ts){
  const pool=S.prods.filter(p=>!p.out), weights=pool.map(p=>/Factura|Pan$|Pan de|Prepizza|Chipá|Burger|Docena/.test(p.n)?6:p.cat==="Tortas y tartas"?1:2);
  const pick=()=>{let r=Math.random()*weights.reduce((a,b)=>a+b),i=0;while((r-=weights[i])>0)i++;return pool[i]};
  const items=[];const k=1+Math.floor(Math.random()*3);
  for(let i=0;i<k;i++){const p=pick();if(items.find(x=>x.pid===p.id))continue;
    items.push(p.unit==="kg"?{pid:p.id,n:p.n,unit:"kg",price:p.price,qty:[.25,.5,.5,1][Math.floor(Math.random()*4)]}:{pid:p.id,n:p.n,unit:"u",price:p.price,qty:p.n==="Factura"?[2,3,4,6][Math.floor(Math.random()*4)]:1})}
  const sellers=S.emps.filter(e=>!e.owner&&["e1","e3"].includes(e.id));
  const m=["efectivo","efectivo","mp","mp","debito","transf"][Math.floor(Math.random()*6)];
  return{id:uid(),ts,emp:sellers[Math.floor(Math.random()*sellers.length)].id,method:m,items,total:Math.round(items.reduce((s,i)=>s+i.qty*i.price,0))};
}
function simSale(){const s=randSale(Date.now());S.sales.push(s);save();
  if(curView==="panel"){rPanel()}else toast(`🔔 Nueva venta · ${$$f(s.total)}`)}
function demoWeek(){
  const now=new Date();
  for(let d=7;d>=0;d--){const base=new Date(now);base.setDate(now.getDate()-d);
    const endH=d===0?now.getHours():20;
    for(let h=7;h<=endH;h++){const peak=(h>=7&&h<=10)||(h>=17&&h<=19);const n=peak?6+Math.floor(Math.random()*6):1+Math.floor(Math.random()*3);
      for(let i=0;i<n;i++){const t=new Date(base);t.setHours(h,Math.floor(Math.random()*60),0,0);if(t>now)continue;S.sales.push(randSale(t.getTime()))}}}
  S.sales.sort((a,b)=>a.ts-b.ts);
  if(!S.shifts.some(x=>dayKey(x.in)===today())){const mk=(e,sec,h)=>{const t=new Date();t.setHours(h,Math.floor(Math.random()*20),0,0);if(t<Date.now())S.shifts.push({id:uid(),emp:e,sec,in:t.getTime(),out:null,photo:null})};
    mk("e1","Mostrador",7);mk("e2","Producción",6);mk("e3","Pastelería",8);mk("e4","Limpieza",9)}
  save();
}

/* ================= EQUIPO ================= */
let stream=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function rEquipo(){
  const act=S.shifts.filter(x=>!x.out&&dayKey(x.in)===today());
  const hist=S.shifts.filter(x=>dayKey(x.in)===today()).sort((a,b)=>b.in-a.in);
  const el=t=>{const m=Math.floor((Date.now()-t)/60000);return m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60} min`};
  $("#v-equipo").innerHTML=`<div class="wrap">
   <div class="kiosk"><div style="font-size:40px">👋</div><h3 style="margin:6px 0 4px">Fichar entrada o salida</h3><p class="sub" style="margin-bottom:6px">Con tu código de 4 dígitos. Se toma una foto al fichar.</p>
    <button class="btn" id="fichar">Fichar</button></div>
   <div class="h1" style="font-size:18px">Equipo en vivo <span class="live" style="margin-left:8px">EN VIVO</span></div><div class="sub">Quién está trabajando ahora y en qué sector</div>
   <div class="secs">${CFG.sectores.map(sec=>{const ppl=act.filter(x=>x.sec===sec);return `<div class="secc"><h5>${sec}<span>${ppl.length}</span></h5>
     ${ppl.map(x=>{const e=emp(x.emp);return `<div class="emp">${avatar(e,x.photo)}<div><b>${esc(e.n)}</b><small>Entró ${hhmm(x.in)} · hace ${el(x.in)}</small></div></div>`}).join("")||`<div class="none">Nadie en este sector</div>`}</div>`}).join("")}</div>
   <div class="card" style="margin-top:14px"><h4>Registro de hoy</h4>
    <table class="h"><thead><tr><th>Empleado</th><th>Sector</th><th>Entrada</th><th>Salida</th><th>Horas</th></tr></thead><tbody>
    ${hist.map(x=>`<tr><td>${esc(emp(x.emp).n)}</td><td>${x.sec}</td><td>${hhmm(x.in)}</td><td>${x.out?hhmm(x.out):"—"}</td><td>${(((x.out||Date.now())-x.in)/36e5).toFixed(1)} h</td></tr>`).join("")||`<tr><td colspan="5" class="none">Sin fichajes hoy</td></tr>`}</tbody></table></div></div>`;
  $("#fichar").onclick=()=>pinModal("Fichar","Ingresá tu código",e=>clockModal(e));
}
function clockModal(e){
  const open=S.shifts.find(x=>x.emp===e.id&&!x.out&&dayKey(x.in)===today());
  let sec=open?.sec||CFG.sectores[0], photo=null;
  modal(`<h3>Hola, ${esc(e.n)}</h3><p class="s">${open?`Estás en <b>${open.sec}</b> desde las ${hhmm(open.in)}`:"Elegí tu sector y marcá la entrada"}</p>
   <div class="g2">${CFG.sectores.map(s=>`<button class="kb${s===sec?" sel":""}" data-sec="${s}">${s}</button>`).join("")}</div>
   <video id="cam" autoplay playsinline muted></video><div class="err" id="camE" style="color:var(--mut);font-weight:400"></div>
   ${open?`<button class="btn" id="chg">Cambiar de sector</button><button class="btn" style="background:var(--wood)" id="out">Marcar salida</button>`:`<button class="btn green" id="in">Marcar entrada</button>`}
   <button class="btn ghost" id="cx">Cancelar</button>`);
  $("#md").querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{sec=b.dataset.sec;$("#md").querySelectorAll("[data-sec]").forEach(x=>x.classList.toggle("sel",x===b))});
  navigator.mediaDevices?.getUserMedia({video:{facingMode:"user",width:320,height:240}}).then(s=>{stream=s;$("#cam").srcObject=s}).catch(()=>{$("#cam").style.display="none";$("#camE").textContent="Cámara no disponible: se ficha sin foto."});
  const snap=()=>{try{const v=$("#cam");if(!stream||!v.videoWidth)return null;const c=document.createElement("canvas");c.width=c.height=96;const s=Math.min(v.videoWidth,v.videoHeight);c.getContext("2d").drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,96,96);return c.toDataURL("image/jpeg",.7)}catch(x){return null}};
  $("#cx").onclick=closeM;
  if(open){
    $("#chg").onclick=()=>{if(sec===open.sec){toast("Ya estás en "+sec);return}open.out=Date.now();S.shifts.push({id:uid(),emp:e.id,sec,in:Date.now(),out:null,photo:snap()||open.photo});save();closeM();rEquipo();toast(`${e.n} ahora en ${sec}`)};
    $("#out").onclick=()=>{open.out=Date.now();save();closeM();rEquipo();toast(`Chau ${e.n}, ¡buen descanso!`)};
  }else $("#in").onclick=()=>{S.shifts.push({id:uid(),emp:e.id,sec,in:Date.now(),out:null,photo:snap()});save();closeM();rEquipo();toast(`✓ Entrada de ${e.n} · ${sec}`)};
}

/* ================= PRODUCTOS ================= */
let pCat="Todas";
function rProd(){
  let list=S.prods.filter(p=>pCat==="Todas"||p.cat===pCat);
  list=S.sort==="man"?[...list].sort((a,b)=>a.ord-b.ord):sortedProds(list);
  $("#v-prod").innerHTML=`<div class="wrap">
   <div class="h1">Productos y precios</div><div class="sub">Tocá un precio para cambiarlo. El cambio llega al instante al mostrador.</div>
   <div class="bar"><button class="btn" style="width:auto;margin:0;padding:11px 16px" id="upAll">📈 Actualizar precios</button>
    <button class="btn ghost" style="width:auto;margin:0;padding:11px 16px" id="addP">+ Producto</button>
    <select class="sortsel" id="psort">${[["top","Más vendidos"],["az","A–Z"],["pu","Precio ↑"],["pd","Precio ↓"],["man","Mi orden (manual)"]].map(([k,t])=>`<option value="${k}"${S.sort===k?" selected":""}>${t}</option>`).join("")}</select></div>
   <div class="chips">${["Todas",...S.cats].map(c=>`<button class="chip${c===pCat?" on":""}" data-pc="${esc(c)}">${esc(c)}</button>`).join("")}<button class="chip" id="addC">+ Categoría</button></div>
   <div class="plist">${list.map(p=>`<div class="prow"><div><b>${esc(p.n)}</b><small>${esc(p.cat)} · ${p.unit==="kg"?"por kilo":"por unidad"}${p.out?" · <span style='color:var(--err)'>sin stock</span>":""}</small></div>
     <input type="number" inputmode="numeric" value="${p.price}" data-pr="${p.id}" aria-label="Precio de ${esc(p.n)}">
     <button class="tg${p.out?"":" on"}" data-st="${p.id}" title="Hay stock"></button>
     ${S.sort==="man"?`<div class="mv"><button data-mu="${p.id}">▲</button><button data-md="${p.id}">▼</button></div>`:"<span></span>"}</div>`).join("")}</div>
   <div class="note" style="margin-top:14px">📸 <b>Próximamente con Socio IA:</b> sacale una foto a tu lista de precios nueva y la app se actualiza sola, mostrándote antes y después.</div></div>`;
  const v=$("#v-prod");
  v.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{pCat=b.dataset.pc;rProd()});
  $("#psort").onchange=e=>{S.sort=e.target.value;save();rProd()};
  v.querySelectorAll("[data-pr]").forEach(i=>i.onchange=()=>{const p=prod(i.dataset.pr),n=Math.round(+i.value);if(!(n>0)){toast("El precio tiene que ser mayor a 0");i.value=p.price;return}
    S.log.push({ts:Date.now(),pid:p.id,from:p.price,to:n});p.price=n;save();toast(`✓ ${p.n}: ${$$f(n)}`)});
  v.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const p=prod(b.dataset.st);p.out=!p.out;save();rProd();toast(p.out?`${p.n}: sin stock`:`${p.n}: disponible`)});
  const mv=(id,d)=>{const arr=[...S.prods].sort((a,b)=>a.ord-b.ord),i=arr.findIndex(p=>p.id===id),j=i+d;if(j<0||j>=arr.length)return;[arr[i].ord,arr[j].ord]=[arr[j].ord,arr[i].ord];save();rProd()};
  v.querySelectorAll("[data-mu]").forEach(b=>b.onclick=()=>mv(b.dataset.mu,-1));
  v.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>mv(b.dataset.md,1));
  $("#upAll").onclick=bulkModal;
  $("#addP").onclick=addProdModal;
  $("#addC").onclick=()=>{modal(`<h3>Nueva categoría</h3><input class="in" id="nc" placeholder="Ej: Sandwichería"><div class="err" id="ncE"></div><button class="btn" id="ncOk">Agregar</button>`);
    $("#ncOk").onclick=()=>{const n=$("#nc").value.trim();if(!n){$("#ncE").textContent="Escribí un nombre";return}if(S.cats.includes(n)){$("#ncE").textContent="Esa categoría ya existe";return}S.cats.push(n);save();closeM();pCat=n;rProd()}};
}
function addProdModal(){
  modal(`<h3>Nuevo producto</h3><label class="lbl">Nombre</label><input class="in" id="np" placeholder="Ej: Medialuna de manteca">
   <label class="lbl">Categoría</label><select class="in" id="npc">${S.cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
   <div class="g2"><div><label class="lbl">Precio $</label><input class="in" id="npp" type="number" inputmode="numeric"></div>
   <div><label class="lbl">Se vende por</label><select class="in" id="npu"><option value="u">Unidad</option><option value="kg">Kilo</option></select></div></div>
   <div class="err" id="npE"></div><button class="btn" id="npOk">Agregar producto</button>`);
  $("#npOk").onclick=()=>{const n=$("#np").value.trim(),pr=Math.round(+$("#npp").value);
    if(!n){$("#npE").textContent="Escribí el nombre";return} if(!(pr>0)){$("#npE").textContent="El precio tiene que ser mayor a 0";return}
    if(S.prods.some(p=>p.n.toLowerCase()===n.toLowerCase())){$("#npE").textContent="Ya existe un producto con ese nombre";return}
    S.prods.push({id:"p"+uid(),n,cat:$("#npc").value,unit:$("#npu").value,price:pr,out:false,ord:S.prods.length});save();closeM();rProd();toast("✓ "+n+" agregado")};
}
function bulkModal(){
  const list=S.prods.filter(p=>pCat==="Todas"||p.cat===pCat);
  const nv={};list.forEach(p=>nv[p.id]=p.price);
  modal(`<h3>Actualizar precios</h3><p class="s">${pCat==="Todas"?"Todos los productos":esc(pCat)} · aplicá un aumento general o editá uno por uno.</p>
   <div style="display:flex;gap:8px"><input class="in" id="pc" type="number" inputmode="decimal" placeholder="% de aumento, ej: 10"><button class="kb" id="pcA" style="padding:0 18px">Aplicar</button></div>
   <label class="lbl"><input type="checkbox" id="rnd" checked> Redondear a $100</label>
   <div id="chgL"></div><div class="err" id="bE"></div>
   <button class="btn green" id="bOk">✓ Realizar cambios</button><button class="btn ghost" id="bX">Cancelar</button>`);
  const draw=()=>{$("#chgL").innerHTML=list.map(p=>{const d=nv[p.id]-p.price,pc=Math.round(d/p.price*100);
    return `<div class="chg"><div><b>${esc(p.n)}</b><div>${d?`<s>${$$f(p.price)}</s> → <b>${$$f(nv[p.id]||0)}</b> <span class="pct ${pc>0?"up":"down"}">${pc>0?"+":""}${pc}%</span>`:`<span style="color:var(--mut)">${$$f(p.price)} · sin cambio</span>`}</div></div>
    <span>$</span><input type="number" inputmode="numeric" data-nv="${p.id}" value="${nv[p.id]}"></div>`}).join("");
    $("#chgL").querySelectorAll("[data-nv]").forEach(i=>i.oninput=()=>{nv[i.dataset.nv]=Math.round(+i.value);$("#bE").textContent=""});
    $("#chgL").querySelectorAll("[data-nv]").forEach(i=>i.onchange=draw)};
  draw();
  $("#pcA").onclick=()=>{const pc=+$("#pc").value;if(!pc||pc<-50||pc>300){$("#bE").textContent="Ingresá un porcentaje entre -50 y 300";return}
    list.forEach(p=>{let v=p.price*(1+pc/100);v=$("#rnd").checked?Math.round(v/100)*100:Math.round(v);nv[p.id]=v});draw()};
  $("#bX").onclick=closeM;
  $("#bOk").onclick=()=>{if(list.some(p=>!(nv[p.id]>0))){$("#bE").textContent="Revisá los precios: alguno está vacío o en 0";return}
    let n=0;list.forEach(p=>{if(nv[p.id]!==p.price){S.log.push({ts:Date.now(),pid:p.id,from:p.price,to:nv[p.id]});p.price=nv[p.id];n++}});
    save();closeM();rProd();toast(n?`✓ ${n} precios actualizados`:"No hubo cambios")};
}

/* ================= MEJORAS (pedido diario) ================= */
function rMejoras(){
  const h=new Date().getHours(), when=h<CFG.corteHora?`hoy a las ${CFG.corteHora} h`:`mañana a las ${CFG.corteHora} h`;
  const pend=S.reqs.filter(r=>!r.sent);
  const txt=`*Mejoras para la app de ${CFG.negocio}*\n`+pend.map((r,i)=>`${i+1}. ${r.t}`).join("\n");
  $("#v-mejoras").innerHTML=`<div class="wrap" style="max-width:640px">
   <div class="h1">✨ Cada noche tu app mejora</div><div class="sub">Anotá durante el día todo lo que quieras cambiar.</div>
   <div class="note">🌙 Tu lista se envía <b>${when}</b> y a la mañana siguiente encontrás los cambios listos.<br>Entran ajustes de colores, productos, categorías, textos y orden. Las funciones nuevas se cotizan aparte.</div>
   <div style="display:flex;gap:8px;margin-bottom:12px"><input class="in" id="rq" placeholder="Ej: la categoría Facturas en otro color"><button class="btn" style="width:auto;margin:0;padding:0 18px" id="rqA">Agregar</button></div>
   <div class="err" id="rqE"></div>
   ${pend.map(r=>`<div class="req"><p>${esc(r.t)}<small>Anotado ${hhmm(r.ts)}</small></p><button data-rd="${r.id}" aria-label="Quitar">✕</button></div>`).join("")||`<div class="empty">Todavía no anotaste cambios para hoy.</div>`}
   ${pend.length?`<a class="wa" id="rqS" target="_blank" rel="noopener" href="https://wa.me/${CFG.waAppIA}?text=${encodeURIComponent(txt)}">Enviar ${pend.length} pedido${pend.length>1?"s":""} ahora por WhatsApp</a>`:""}</div>`;
  const add=()=>{const t=$("#rq").value.trim();if(t.length<4){$("#rqE").textContent="Contanos un poco más qué querés cambiar";return}S.reqs.push({id:uid(),t,ts:Date.now(),sent:false});save();rMejoras();toast("✓ Anotado")};
  $("#rqA").onclick=add;$("#rq").onkeydown=e=>{if(e.key==="Enter")add()};
  document.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{S.reqs=S.reqs.filter(r=>r.id!==b.dataset.rd);save();rMejoras()});
  const s=$("#rqS");if(s)s.onclick=()=>{S.reqs.forEach(r=>r.sent=true);save();setTimeout(rMejoras,500)};
}

/* ================= SYNC ENTRE PESTAÑAS ================= */
window.addEventListener("storage",e=>{if(e.key!==KEY)return;try{S=JSON.parse(e.newValue)||S}catch(x){}if(curView==="panel")rPanel();if(curView==="equipo")rEquipo()});
setInterval(()=>{if(curView==="equipo")rEquipo()},60000);

/* ================= INICIO ================= */
trial();renderSeller();go("caja");
</script>
</body>
